; Qwen3.8-Flash-Next — 125B/6B MoE + 51B n-gram table (qwen4exp). UD-Q3_K_XL ~90GB.
; RTX 2000 max-speed — pack MoE/attention on GPU; n-gram table mmap'd from NVMe (not resident).
; Cannot combine --fit with --override-tensor. Raise n-cpu-moe if load/OOM; lower if VRAM headroom.
; Requires llama.cpp.flash-next (qwen4exp arch). Text-only; add mmproj for vision.
; reasoning-effort: xhigh, medium, or low — same as Qwen3.8-27B (via chat_template_kwargs).
[qwen3.8-flash-next-q3_k_xl]
llama-cpp-root = /home/user/llama.cpp.flash-next
model = {llama-root}/Qwen3.8-Flash-Next-GGUF/UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
c = 65536
ngl = 999
n-cpu-moe = 42
load-mode = mmap
lazy-mode = on
override-tensor = per_layer_token_embd.weight=CPU
mlock = false
np = 1
b = 128
reasoning-effort = medium
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

; Qwen-Image-2.1 — bf16 DiT ~14GB + Qwen3-VL-8B text encoder ~17GB. Not a llama-server model.
; 16GB card: sequential offload, 768². Output size must be divisible by 16.
; A prompt may set seed or aspect (16:9, 20:9). Aspect is fitted inside width and height.
[qwen-image-2.1]
runner = image
hf-repo = Qwen/Qwen-Image-2.1
pipeline = qwen-image-2.1
model = /home/user/media-models/Qwen-Image-2.1
dtype = bfloat16
offload = sequential
width = 768
height = 768
steps = 20
seed = 42

; FLUX 3 Image Klein distilled — 5.6B DiT bf16 ~10GB + Qwen3-VL-4B ~8GB. Not a llama-server model.
; https://huggingface.co/black-forest-labs/flux-3-image-klein
; 16 steps, no guidance. One component on the GPU at a time. 1280² matches the 5090 profile.
; A 16-step frame uses nearly all 16GB. A three-reference edit fits.
; Accept the license on the model page before the first download.
; Suite prompts are full captions, so the separate 9B prompt upsampler is not loaded.
[flux-3-image-klein]
runner = image
hf-repo = black-forest-labs/flux-3-image-klein
pipeline = flux-3-image-klein
model = /home/user/media-models/flux-3-image-klein
dtype = bfloat16
offload = model
width = 1280
height = 1280
steps = 16
seed = 42

; MOSS-Image-SFT — 5B DiT bf16 ~10GB + Qwen3.5 text encoder ~17GB. Not a llama-server model.
; https://huggingface.co/OpenMOSS-Team/MOSS-Image-SFT
; Publisher sampling: 50 steps, CFG 3, shift 5, negative-branch skip of layer 22, empty negative prompt.
; The text encoder alone is larger than 16GB, so sequential offload. Both cards generate at 1280².
; This checkpoint is text-to-image. Reference-image edits are a different variant and do not run.
[moss-image-sft]
runner = image
hf-repo = OpenMOSS-Team/MOSS-Image-SFT
pipeline = moss-image-sft
model = /home/user/media-models/MOSS-Image-SFT
dtype = bfloat16
offload = sequential
width = 1280
height = 1280
steps = 50
guidance-scale = 3
uncond-skip-layers = 22
seed = 42

; LTX-2.5 distilled. width/height are the final stage-2 size (divisible by 64); stage 1 is half.
; 32GB system RAM cannot hold the 22B transformer, so weights stream from disk.
; frames % 8 == 1. 257 frames at 24 fps is about 10.7 seconds.
; Accept the license on https://huggingface.co/Lightricks/LTX-2.5 before the first download.
[ltx-2.5-distilled]
runner = video
hf-repo = Lightricks/LTX-2.5
pipeline = ltx-2.5-distilled
model = /home/user/media-models/LTX-2.5
transformer = diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors
text-encoder = text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors
video-vae = vae/ltx-2.5-video-vae-conv-bf16.safetensors
audio-vae = vae/ltx-2.5-audio-vae-bf16.safetensors
spatial-upsampler = latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors
quantization = fp8-cast
offload = disk
width = 512
height = 320
num-frames = 257
frame-rate = 24

