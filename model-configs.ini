; Stock llama.cpp (arch lfm2moe). No MTP (DSpark draft is "coming soon" on the card). No fork.
; https://huggingface.co/LiquidAI/LFM2.5-24B-A2B and generation_config.json, also
; https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-GGUF and https://docs.liquid.ai/lfm/models/lfm25-24b-a2b :
;   temperature=0.1, top_k=50, repetition_penalty=1.05. One preset for every task; no coding preset.
; generation_config.json and the docs sampler table omit top_p (marked "—"). llama.cpp defaults
; top_p to 0.95, so top-p=1.0 keeps only the published top-k cutoff. No min-p, typical-p,
; presence penalty, frequency penalty, or reasoning-effort published — left unset.
; Always-think model: the chat template opens each assistant turn with <think>. jinja stays on (default).
; Trained context 131072. KV is the 10 attention layers only (8 kv heads, head dim 64):
; q8_0 ≈ 10.6 KB/token → ~1.33 GiB at 128k. Weights + 128k KV fit in 16GB, so ngl=999.
